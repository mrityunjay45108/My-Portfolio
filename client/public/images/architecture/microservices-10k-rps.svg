<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Grid background dots -->
  <g opacity="0.15">
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94a3b8"/>
    </pattern>
    <rect width="1200" height="675" fill="url(#grid)"/>
  </g>

  <!-- Ambient Glows -->
  <circle cx="200" cy="340" r="180" fill="#6366f1" opacity="0.08" filter="url(#glow)"/>
  <circle cx="600" cy="340" r="220" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="340" r="180" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Architecture Header Banner -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="60" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="36" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20">Distributed 10,000 RPS Microservices Architecture</text>
    <rect x="780" y="16" width="130" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="845" y="34" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">p99 &lt; 45ms</text>
    <rect x="925" y="16" width="125" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="987" y="34" fill="#34d399" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Docker + Kafka</text>
  </g>

  <!-- 1. Client Layer -->
  <g transform="translate(60, 150)">
    <rect width="180" height="460" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="44" rx="20" fill="#1e293b" fill-opacity="0.8"/>
    <text x="90" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Client Applications</text>

    <!-- Client Cards -->
    <rect x="18" y="70" width="144" height="75" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="90" y="102" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Next.js Web App</text>
    <text x="90" y="124" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">SSR &amp; Edge Cached</text>

    <rect x="18" y="165" width="144" height="75" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="90" y="197" fill="#818cf8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">React Native App</text>
    <text x="90" y="219" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Mobile iOS / Android</text>

    <rect x="18" y="260" width="144" height="75" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="90" y="292" fill="#a78bfa" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Third-Party APIs</text>
    <text x="90" y="314" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">B2B Partners / Webhooks</text>

    <!-- Cloudflare CDN -->
    <rect x="18" y="360" width="144" height="75" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <text x="90" y="392" fill="#c7d2fe" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Cloudflare CDN</text>
    <text x="90" y="414" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">DDoS &amp; Geo DNS</text>
  </g>

  <!-- Connection: Client to Gateway -->
  <path d="M 240 280 L 300 280" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="300,276 308,280 300,284" fill="#6366f1"/>

  <!-- 2. API Gateway & Security Layer -->
  <g transform="translate(310, 150)">
    <rect width="170" height="460" rx="20" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.8"/>
    <rect x="0" y="0" width="170" height="44" rx="20" fill="#312e81" fill-opacity="0.8"/>
    <text x="85" y="28" fill="#e0e7ff" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Kong API Gateway</text>

    <rect x="15" y="70" width="140" height="65" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="85" y="98" fill="#f43f5e" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Rate Limiter</text>
    <text x="85" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Token Bucket / Redis</text>

    <rect x="15" y="150" width="140" height="65" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="85" y="178" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">JWT Stateless Auth</text>
    <text x="85" y="198" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">mTLS &amp; RBAC Guard</text>

    <rect x="15" y="230" width="140" height="65" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="85" y="258" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Reverse Proxy</text>
    <text x="85" y="278" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dynamic Service Routing</text>

    <rect x="15" y="310" width="140" height="125" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="85" y="340" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Load Balancer</text>
    <text x="85" y="362" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Round Robin</text>
    <text x="85" y="382" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Health Check Probes</text>
    <text x="85" y="405" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">10,000 req/sec</text>
  </g>

  <!-- Connection: Gateway to Microservices -->
  <path d="M 480 230 L 530 200" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 480 300 L 530 300" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 480 370 L 530 400" stroke="#38bdf8" stroke-width="2" fill="none"/>
  <path d="M 480 440 L 530 500" stroke="#38bdf8" stroke-width="2" fill="none"/>

  <!-- 3. Microservices Cluster (Dockerized on Kubernetes) -->
  <g transform="translate(540, 150)">
    <rect width="250" height="460" rx="20" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.8"/>
    <rect x="0" y="0" width="250" height="44" rx="20" fill="#075985" fill-opacity="0.8"/>
    <text x="125" y="28" fill="#e0f2fe" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Microservices (Docker / K8s)</text>

    <!-- Auth Service -->
    <rect x="15" y="60" width="220" height="68" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <circle cx="35" cy="94" r="8" fill="#6366f1"/>
    <text x="52" y="88" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Auth &amp; User Service</text>
    <text x="52" y="106" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Node.js • Express • JWT Token</text>

    <!-- Product Catalog Service -->
    <rect x="15" y="140" width="220" height="68" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <circle cx="35" cy="174" r="8" fill="#06b6d4"/>
    <text x="52" y="168" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Product Catalog Service</text>
    <text x="52" y="186" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Sub-10ms Redis Caching Layer</text>

    <!-- Order & Checkout (Saga) -->
    <rect x="15" y="220" width="220" height="74" rx="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
    <circle cx="35" cy="257" r="8" fill="#0ea5e9"/>
    <text x="52" y="248" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12">Order &amp; Checkout Service</text>
    <text x="52" y="266" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Distributed Saga Orchestrator</text>
    <text x="52" y="282" fill="#34d399" font-family="monospace" font-size="9">Atomic Inventory Locks</text>

    <!-- Payment Service -->
    <rect x="15" y="306" width="220" height="64" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <circle cx="35" cy="338" r="8" fill="#10b981"/>
    <text x="52" y="332" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Payment Service</text>
    <text x="52" y="350" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Stripe Webhooks &amp; Idempotency</text>

    <!-- Notification Service -->
    <rect x="15" y="380" width="220" height="64" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <circle cx="35" cy="412" r="8" fill="#f59e0b"/>
    <text x="52" y="406" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="600" font-size="12">Notification Service</text>
    <text x="52" y="424" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Async Email / SMS Dispatcher</text>
  </g>

  <!-- Connection: Microservices to Event Bus & Databases -->
  <path d="M 790 257 L 840 257" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="840,253 848,257 840,261" fill="#38bdf8"/>

  <!-- 4. Event Streaming & Caching Layer -->
  <g transform="translate(850, 150)">
    <rect width="140" height="460" rx="20" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.8"/>
    <rect x="0" y="0" width="140" height="44" rx="20" fill="#065f46" fill-opacity="0.8"/>
    <text x="70" y="28" fill="#d1fae5" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">Event &amp; Cache</text>

    <!-- Redis Cluster -->
    <rect x="12" y="65" width="116" height="155" rx="12" fill="#18181b" stroke="#dc2626" stroke-width="1.2"/>
    <text x="70" y="94" fill="#f87171" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Redis Cluster</text>
    <text x="70" y="118" fill="#fca5a5" font-family="monospace" font-size="10" text-anchor="middle">Lua Scripts</text>
    <text x="70" y="138" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Atomic Decrement</text>
    <text x="70" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Pub/Sub Channels</text>
    <text x="70" y="178" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Session Store</text>
    <text x="70" y="202" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">&lt; 2ms latency</text>

    <!-- Kafka Cluster -->
    <rect x="12" y="245" width="116" height="195" rx="12" fill="#18181b" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="70" y="275" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Apache Kafka</text>
    <text x="70" y="300" fill="#fde68a" font-family="monospace" font-size="9" text-anchor="middle">order-events</text>
    <text x="70" y="320" fill="#fde68a" font-family="monospace" font-size="9" text-anchor="middle">payment-events</text>
    <text x="70" y="340" fill="#fde68a" font-family="monospace" font-size="9" text-anchor="middle">inventory-sync</text>
    <text x="70" y="360" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Partitioning Key</text>
    <text x="70" y="380" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Zero Data Loss</text>
    <text x="70" y="415" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">100k msg/sec</text>
  </g>

  <!-- Connection: Event to Persistent Storage -->
  <path d="M 990 280 L 1030 280" stroke="#10b981" stroke-width="2" fill="none"/>
  <polygon points="1030,276 1038,280 1030,284" fill="#10b981"/>

  <!-- 5. Persistence & Observability -->
  <g transform="translate(1040, 150)">
    <rect width="110" height="460" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="44" rx="20" fill="#1e293b" fill-opacity="0.8"/>
    <text x="55" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Databases</text>

    <!-- PostgreSQL -->
    <rect x="10" y="65" width="90" height="95" rx="10" fill="#090d16" stroke="#3b82f6" stroke-width="1"/>
    <text x="55" y="92" fill="#60a5fa" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">PostgreSQL</text>
    <text x="55" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Primary DB</text>
    <text x="55" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Read Replicas</text>
    <text x="55" y="148" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">ACID Safe</text>

    <!-- MongoDB -->
    <rect x="10" y="175" width="90" height="95" rx="10" fill="#090d16" stroke="#10b981" stroke-width="1"/>
    <text x="55" y="202" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">MongoDB</text>
    <text x="55" y="222" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Product Specs</text>
    <text x="55" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Audit Logs</text>
    <text x="55" y="258" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">Flexible</text>

    <!-- Monitoring & Telemetry -->
    <rect x="10" y="285" width="90" height="155" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1"/>
    <text x="55" y="312" fill="#c7d2fe" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Telemetry</text>
    <text x="55" y="336" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Prometheus</text>
    <text x="55" y="356" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Grafana</text>
    <text x="55" y="376" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Jaeger Tracing</text>
    <text x="55" y="396" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Sentry Logs</text>
    <text x="55" y="425" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">99.99% Uptime</text>
  </g>
</svg>
