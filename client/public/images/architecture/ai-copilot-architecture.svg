<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cardGradAi" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="aiPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="aiCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgAi)"/>

  <!-- Background Dots -->
  <g opacity="0.15">
    <pattern id="gridAi" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#a78bfa"/>
    </pattern>
    <rect width="1200" height="675" fill="url(#gridAi)"/>
  </g>

  <!-- Ambient Light Glows -->
  <circle cx="200" cy="340" r="190" fill="#6366f1" opacity="0.1" filter="url(#glowAi)"/>
  <circle cx="600" cy="340" r="230" fill="#8b5cf6" opacity="0.12" filter="url(#glowAi)"/>
  <circle cx="1000" cy="340" r="190" fill="#ec4899" opacity="0.1" filter="url(#glowAi)"/>

  <!-- Architecture Header Banner -->
  <g transform="translate(60, 45)">
    <rect width="1080" height="60" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="30" y="36" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20">AI Interview Copilot &amp; Real-Time Voice/RAG Pipeline</text>
    <rect x="760" y="16" width="145" height="28" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="832" y="34" fill="#a78bfa" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Latency &lt; 850ms</text>
    <rect x="918" y="16" width="135" height="28" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="985" y="34" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">Whisper + RAG</text>
  </g>

  <!-- 1. Client Layer -->
  <g transform="translate(60, 150)">
    <rect width="180" height="460" rx="20" fill="url(#cardGradAi)" stroke="#4338ca" stroke-width="1.5"/>
    <rect x="0" y="0" width="180" height="44" rx="20" fill="#312e81" fill-opacity="0.8"/>
    <text x="90" y="28" fill="#e0e7ff" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Client &amp; Input Layer</text>

    <!-- Web App -->
    <rect x="18" y="65" width="144" height="75" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="90" y="96" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Next.js Web Cockpit</text>
    <text x="90" y="118" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Audio Worklet Ring Buffer</text>

    <!-- Mobile App -->
    <rect x="18" y="155" width="144" height="75" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="90" y="186" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Seekho English App</text>
    <text x="90" y="208" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">React Native / Expo</text>

    <!-- Admin Studio -->
    <rect x="18" y="245" width="144" height="85" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="90" y="275" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Emma AI Studio</text>
    <text x="90" y="295" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Lesson Publisher</text>
    <text x="90" y="313" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Hindi-English Pairs</text>

    <!-- Duplex Streaming Box -->
    <rect x="18" y="350" width="144" height="85" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="90" y="380" fill="#a78bfa" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Duplex Audio Stream</text>
    <text x="90" y="402" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">PCM 16kHz • Opus</text>
    <text x="90" y="420" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">WSS &lt; 20ms Frame</text>
  </g>

  <!-- Connection: Client to Audio Orchestration -->
  <path d="M 240 280 L 290 280" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="290,276 298,280 290,284" fill="#8b5cf6"/>

  <!-- 2. Streaming & Ingestion Layer -->
  <g transform="translate(300, 150)">
    <rect width="180" height="460" rx="20" fill="url(#cardGradAi)" stroke="#6366f1" stroke-width="1.8"/>
    <rect x="0" y="0" width="180" height="44" rx="20" fill="#3730a3" fill-opacity="0.8"/>
    <text x="90" y="28" fill="#e0e7ff" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">Streaming Gateway</text>

    <!-- WebSocket Server -->
    <rect x="15" y="65" width="150" height="75" rx="12" fill="#090d16" stroke="#475569" stroke-width="1"/>
    <text x="90" y="95" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">WebSocket Gateway</text>
    <text x="90" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Duplex Audio Handshake</text>
    <text x="90" y="130" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">Connection Pool</text>

    <!-- Whisper Engine -->
    <rect x="15" y="155" width="150" height="90" rx="12" fill="#090d16" stroke="#8b5cf6" stroke-width="1.2"/>
    <text x="90" y="185" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Whisper ASR Engine</text>
    <text x="90" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Speech-to-Text Pipeline</text>
    <text x="90" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Sub-second chunking</text>
    <text x="90" y="238" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">VAD Silence Filter</text>

    <!-- Redis Ring Buffer -->
    <rect x="15" y="260" width="150" height="85" rx="12" fill="#090d16" stroke="#ef4444" stroke-width="1.2"/>
    <text x="90" y="290" fill="#f87171" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Redis Ring Buffer</text>
    <text x="90" y="310" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Jitter Stabilization</text>
    <text x="90" y="328" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Ephemeral Audio Packets</text>

    <!-- Token Pruner -->
    <rect x="15" y="360" width="150" height="75" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="90" y="390" fill="#fbbf24" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Context Optimizer</text>
    <text x="90" y="410" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Prompt Token Pruning</text>
    <text x="90" y="425" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">-40% Token Cost</text>
  </g>

  <!-- Connection: Gateway to RAG & Reasoning -->
  <path d="M 480 280 L 530 280" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="530,276 538,280 530,284" fill="#38bdf8"/>

  <!-- 3. Vector Knowledge & RAG Pipeline -->
  <g transform="translate(540, 150)">
    <rect width="250" height="460" rx="20" fill="url(#cardGradAi)" stroke="#8b5cf6" stroke-width="1.8"/>
    <rect x="0" y="0" width="250" height="44" rx="20" fill="#5b21b6" fill-opacity="0.8"/>
    <text x="125" y="28" fill="#ede9fe" font-family="system-ui, sans-serif" font-weight="700" font-size="14" text-anchor="middle">RAG Knowledge Engine</text>

    <!-- Embedding Model -->
    <rect x="15" y="65" width="220" height="75" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="125" y="95" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Text &amp; Acoustic Embeddings</text>
    <text x="125" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">FastEmbed • text-embedding-3</text>
    <text x="125" y="130" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">Dense Vectorization (1536d)</text>

    <!-- Vector DB / pgvector -->
    <rect x="15" y="155" width="220" height="90" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="125" y="185" fill="#e9d5ff" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">PostgreSQL + pgvector</text>
    <text x="125" y="206" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">5,000+ Interview Transcripts</text>
    <text x="125" y="224" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Company Specific Rubrics &amp; DSA</text>
    <text x="125" y="238" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">HNSW Index &lt; 15ms Retrieval</text>

    <!-- Hybrid Retrieval BM25 -->
    <rect x="15" y="260" width="220" height="85" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="125" y="290" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Hybrid Search (Dense + BM25)</text>
    <text x="125" y="310" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Reciprocal Rank Fusion (RRF)</text>
    <text x="125" y="328" fill="#a78bfa" font-family="monospace" font-size="9" text-anchor="middle">Zero Hallucination Grounding</text>

    <!-- Candidate Resume Context -->
    <rect x="15" y="360" width="220" height="75" rx="12" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="125" y="390" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Candidate Experience Mapping</text>
    <text x="125" y="410" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Role, Experience &amp; ATS Criteria</text>
  </g>

  <!-- Connection: RAG to LLM Evaluation -->
  <path d="M 790 280 L 840 280" stroke="#ec4899" stroke-width="2.5" fill="none"/>
  <polygon points="840,276 848,280 840,284" fill="#ec4899"/>

  <!-- 4. LLM Reasoning & Scorecard -->
  <g transform="translate(850, 150)">
    <rect width="140" height="460" rx="20" fill="url(#cardGradAi)" stroke="#db2777" stroke-width="1.8"/>
    <rect x="0" y="0" width="140" height="44" rx="20" fill="#831843" fill-opacity="0.8"/>
    <text x="70" y="28" fill="#fce7f3" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">LLM Evaluation</text>

    <!-- Schema Enforced LLM -->
    <rect x="12" y="65" width="116" height="150" rx="12" fill="#18181b" stroke="#ec4899" stroke-width="1.2"/>
    <text x="70" y="94" fill="#f472b6" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">LLM Inference</text>
    <text x="70" y="118" fill="#fbcfe8" font-family="monospace" font-size="9" text-anchor="middle">Zod Schema Guard</text>
    <text x="70" y="138" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Deterministic Eval</text>
    <text x="70" y="158" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Structured JSON</text>
    <text x="70" y="178" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Grammar / Accuracy</text>
    <text x="70" y="200" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">Function Calling</text>

    <!-- Rubrics Scoring Engine -->
    <rect x="12" y="235" width="116" height="200" rx="12" fill="#18181b" stroke="#06b6d4" stroke-width="1.2"/>
    <text x="70" y="265" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Rubric Matrix</text>
    <text x="70" y="290" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">1. Technical Depth</text>
    <text x="70" y="310" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">2. Clarity &amp; Fluency</text>
    <text x="70" y="330" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">3. Problem Solving</text>
    <text x="70" y="350" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">4. Time Efficiency</text>
    <text x="70" y="380" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Hindi-English Hint</text>
    <text x="70" y="415" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">Instant Scorecard</text>
  </g>

  <!-- Connection: LLM to Output Delivery -->
  <path d="M 990 280 L 1030 280" stroke="#10b981" stroke-width="2" fill="none"/>
  <polygon points="1030,276 1038,280 1030,284" fill="#10b981"/>

  <!-- 5. Real-Time Feedback Delivery -->
  <g transform="translate(1040, 150)">
    <rect width="110" height="460" rx="20" fill="url(#cardGradAi)" stroke="#059669" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="44" rx="20" fill="#065f46" fill-opacity="0.8"/>
    <text x="55" y="28" fill="#d1fae5" font-family="system-ui, sans-serif" font-weight="700" font-size="12" text-anchor="middle">Live Outputs</text>

    <!-- Streamed Feedback -->
    <rect x="10" y="65" width="90" height="110" rx="10" fill="#090d16" stroke="#10b981" stroke-width="1"/>
    <text x="55" y="92" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Live Audio</text>
    <text x="55" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">TTS Synthesis</text>
    <text x="55" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Conversational</text>
    <text x="55" y="152" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">&lt; 850ms</text>

    <!-- Radar Scorecard -->
    <rect x="10" y="190" width="90" height="120" rx="10" fill="#090d16" stroke="#8b5cf6" stroke-width="1"/>
    <text x="55" y="218" fill="#c084fc" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Radar Charts</text>
    <text x="55" y="240" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Skill Matrix</text>
    <text x="55" y="260" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Code Quality</text>
    <text x="55" y="285" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">94% Positive</text>

    <!-- Analytics Storage -->
    <rect x="10" y="325" width="90" height="115" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="55" y="352" fill="#c7d2fe" font-family="system-ui, sans-serif" font-weight="600" font-size="11" text-anchor="middle">Telemetry</text>
    <text x="55" y="375" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Prisma ORM</text>
    <text x="55" y="395" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Session Audit</text>
    <text x="55" y="420" fill="#34d399" font-family="monospace" font-size="9" text-anchor="middle">99.8% Uptime</text>
  </g>
</svg>
